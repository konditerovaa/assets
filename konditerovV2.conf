[General]
loglevel = notify

dns-server = system, 1.1.1.1, 8.8.8.8
skip-proxy = 127.0.0.1, localhost, *.local, *.lan

# =========================
# ПРОКСИ ИЗ ПОДПИСКИ
# =========================

[Proxy Group]
AUTO = url-test, (.*), url=https://www.gstatic.com/generate_204, interval=300
PROXY = select, AUTO, DIRECT
DIRECT = direct

# =========================
# RULES
# =========================

[Rule]

# 🏠 ЛОКАЛКА
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# 🇷🇺 РФ
DOMAIN-KEYWORD,bank,DIRECT
DOMAIN-KEYWORD,tinkoff,DIRECT
DOMAIN-KEYWORD,sber,DIRECT
DOMAIN-KEYWORD,vtb,DIRECT

DOMAIN-SUFFIX,yandex.ru,DIRECT
DOMAIN-SUFFIX,mail.ru,DIRECT
DOMAIN-SUFFIX,vk.com,DIRECT

# Ozon (анти-палево)
DOMAIN-KEYWORD,ozon,DIRECT
DOMAIN-SUFFIX,ozon.ru,DIRECT
DOMAIN-SUFFIX,ozoncdn.ru,DIRECT
DOMAIN-SUFFIX,ozonusercontent.com,DIRECT
DOMAIN-SUFFIX,wildberries.ru,DIRECT

# =========================
# 🔥 ChatGPT (ЖЁСТКИЙ ПЕРЕХВАТ)
# =========================
PROCESS-NAME,ChatGPT,PROXY

# =========================
# 🔥 TELEGRAM
# =========================
DOMAIN-KEYWORD,telegram,PROXY
IP-CIDR,91.108.0.0/16,PROXY,no-resolve
IP-CIDR,149.154.0.0/16,PROXY,no-resolve

# =========================
# 🔥 YOUTUBE
# =========================
DOMAIN-KEYWORD,youtube,PROXY
DOMAIN-KEYWORD,googlevideo,PROXY
DOMAIN-KEYWORD,ytimg,PROXY
DOMAIN-SUFFIX,googleapis.com,PROXY
DOMAIN-SUFFIX,gstatic.com,PROXY
DOMAIN-KEYWORD,google,PROXY

# =========================
# 🔥 СОЦСЕТИ
# =========================
DOMAIN-SUFFIX,instagram.com,PROXY
DOMAIN-SUFFIX,facebook.com,PROXY
DOMAIN-SUFFIX,fbcdn.net,PROXY

DOMAIN-SUFFIX,tiktok.com,PROXY
DOMAIN-SUFFIX,byteoversea.com,PROXY

# =========================
# 🔥 ChatGPT (РЕАЛЬНЫЙ ФИКС)
# =========================

# основной триггер
DOMAIN-KEYWORD,openai,PROXY

# 👇 ключ: всё что связано с CDN/AI
DOMAIN-KEYWORD,ai,PROXY
DOMAIN-KEYWORD,static,PROXY
DOMAIN-KEYWORD,cdn,PROXY

# =========================
# 🔥 STRAVA
# =========================
DOMAIN-SUFFIX,strava.com,PROXY
DOMAIN-SUFFIX,mapbox.com,PROXY
DOMAIN-SUFFIX,mapboxapi.com,PROXY

# =========================
# 🔥 EBAY
# =========================
DOMAIN-SUFFIX,ebay.com,PROXY
DOMAIN-SUFFIX,ebayimg.com,PROXY

# =========================
# ❗ ВСЁ ОСТАЛЬНО
# =========================
FINAL,DIRECT
