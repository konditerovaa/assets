[General]
loglevel = notify
dns-server = 1.1.1.1, 8.8.8.8
skip-proxy = 127.0.0.1, localhost, *.local, *.lan

[Proxy]
VPN = vless, 89.125.130.93, 443, none, uuid=8247a025-355b-4a56-ac31-fdcacef79a02, security=reality, sni=www.cloudflare.com, fp=chrome, pbk=IAluGHw5WZNTeIJdbGMn4evSskVito4v8tGDVVyO610, sid=970968ab45886f92, udp=true

[Proxy Group]
AUTO = fallback, DIRECT, VPN, url-test=https://www.gstatic.com/generate_204, interval=300
PROXY = select, AUTO, VPN, DIRECT
DIRECT = direct

[Rule]

# =========================
# 🏠 ЛОКАЛКА (ВСЕГДА DIRECT)
# =========================
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# =========================
# 🇷🇺 РФ / БАНКИ (DIRECT)
# =========================
DOMAIN-KEYWORD,bank,DIRECT
DOMAIN-KEYWORD,tinkoff,DIRECT
DOMAIN-KEYWORD,sber,DIRECT
DOMAIN-KEYWORD,vtb,DIRECT

DOMAIN-SUFFIX,yandex.ru,DIRECT
DOMAIN-SUFFIX,mail.ru,DIRECT
DOMAIN-SUFFIX,vk.com,DIRECT

# =========================
# 🔥 КРИТИЧНОЕ (ВСЕГДА VPN)
# =========================

# --- Telegram ---
DOMAIN-KEYWORD,telegram,VPN
IP-CIDR,91.108.0.0/16,VPN,no-resolve
IP-CIDR,149.154.0.0/16,VPN,no-resolve

# --- YouTube ---
DOMAIN-KEYWORD,youtube,VPN
DOMAIN-KEYWORD,googlevideo,VPN
DOMAIN-KEYWORD,ytimg,VPN
DOMAIN-KEYWORD,google,VPN

# --- Instagram / Facebook ---
DOMAIN-SUFFIX,instagram.com,VPN
DOMAIN-SUFFIX,cdninstagram.com,VPN
DOMAIN-SUFFIX,facebook.com,VPN
DOMAIN-SUFFIX,fbcdn.net,VPN

# --- TikTok ---
DOMAIN-SUFFIX,tiktok.com,VPN
DOMAIN-SUFFIX,tiktokcdn.com,VPN
DOMAIN-SUFFIX,byteoversea.com,VPN

# --- ChatGPT (чисто и без дублей) ---
DOMAIN-SUFFIX,openai.com,VPN
DOMAIN-SUFFIX,oaistatic.com,VPN
DOMAIN-SUFFIX,oaiusercontent.com,VPN

# Cloudflare (иначе логин ломается)
DOMAIN-SUFFIX,cloudflare.com,VPN
DOMAIN-SUFFIX,cloudflareinsights.com,VPN

# --- Strava ---
DOMAIN-SUFFIX,strava.com,VPN
DOMAIN-SUFFIX,strava.cz,VPN
DOMAIN-SUFFIX,mapbox.com,VPN
DOMAIN-SUFFIX,mapboxapi.com,VPN

# --- eBay ---
DOMAIN-SUFFIX,ebay.com,VPN
DOMAIN-SUFFIX,ebayimg.com,VPN

# =========================
# 🤖 ВСЁ ОСТАЛЬНО (АВТО)
# =========================
FINAL,AUTO
