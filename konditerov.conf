[General]
loglevel = notify
dns-server = system, 1.1.1.1, 8.8.8.8
skip-proxy = 127.0.0.1, localhost, *.local, *.lan

[Rule]

# --- СИСТЕМА / ЛОКАЛКА ---
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# --- ГОС ---
DOMAIN-SUFFIX,gosuslugi.ru,DIRECT
DOMAIN-SUFFIX,esia.gosuslugi.ru,DIRECT

# --- БАНКИ ---
DOMAIN-KEYWORD,bank,DIRECT
DOMAIN-KEYWORD,tinkoff,DIRECT
DOMAIN-KEYWORD,sber,DIRECT
DOMAIN-KEYWORD,vtb,DIRECT
DOMAIN-KEYWORD,alfabank,DIRECT

# --- VK ---
DOMAIN-SUFFIX,vk.com,DIRECT
DOMAIN-SUFFIX,vk.ru,DIRECT
DOMAIN-SUFFIX,vkvideo.ru,DIRECT
DOMAIN-SUFFIX,userapi.com,DIRECT
DOMAIN-SUFFIX,cdnvk.com,DIRECT
DOMAIN-SUFFIX,vkuservideo.net,DIRECT

# --- Yandex ---
DOMAIN-SUFFIX,yandex.ru,DIRECT
DOMAIN-SUFFIX,yandex.net,DIRECT
DOMAIN-SUFFIX,ya.ru,DIRECT
DOMAIN-SUFFIX,yastatic.net,DIRECT
DOMAIN-SUFFIX,yandexcloud.net,DIRECT
DOMAIN-SUFFIX,kinopoisk.ru,DIRECT

# --- Mail.ru ---
DOMAIN-SUFFIX,mail.ru,DIRECT
DOMAIN-SUFFIX,ok.ru,DIRECT
DOMAIN-SUFFIX,cloud.mail.ru,DIRECT
DOMAIN-SUFFIX,my.mail.ru,DIRECT

# --- Max ---
DOMAIN-SUFFIX,max.ru,DIRECT
DOMAIN-SUFFIX,max.com,DIRECT

# --- 2GIS ---
DOMAIN-SUFFIX,2gis.ru,DIRECT
DOMAIN-SUFFIX,2gis.com,DIRECT
DOMAIN-SUFFIX,2gis.kz,DIRECT
DOMAIN-SUFFIX,2gis.cn,DIRECT
IP-CIDR,91.221.84.0/22,DIRECT,no-resolve
IP-CIDR,185.22.60.0/22,DIRECT,no-resolve

# --- Telegram ---
DOMAIN-SUFFIX,t.me,PROXY
DOMAIN-SUFFIX,telegram.org,PROXY
DOMAIN-SUFFIX,tdesktop.com,PROXY
IP-CIDR,91.108.4.0/22,PROXY,no-resolve
IP-CIDR,91.108.8.0/22,PROXY,no-resolve
IP-CIDR,91.108.12.0/22,PROXY,no-resolve
IP-CIDR,91.108.16.0/22,PROXY,no-resolve
IP-CIDR,91.108.56.0/22,PROXY,no-resolve
IP-CIDR,149.154.160.0/20,PROXY,no-resolve

# --- Соцсети ---
DOMAIN-SUFFIX,instagram.com,PROXY
DOMAIN-SUFFIX,cdninstagram.com,PROXY
DOMAIN-SUFFIX,facebook.com,PROXY
DOMAIN-SUFFIX,fbcdn.net,PROXY

# --- WhatsApp ---
DOMAIN-SUFFIX,whatsapp.com,PROXY
DOMAIN-SUFFIX,whatsapp.net,PROXY

# --- ChatGPT ---
DOMAIN-SUFFIX,openai.com,PROXY

# --- YouTube (обязательно через VPN) ---
DOMAIN-SUFFIX,youtube.com,PROXY
DOMAIN-SUFFIX,youtu.be,PROXY
DOMAIN-SUFFIX,googlevideo.com,PROXY
DOMAIN-SUFFIX,ytimg.com,PROXY
DOMAIN-SUFFIX,youtubei.googleapis.com,PROXY

# ❗ Google API частично оставляем DIRECT (уменьшает нагрузку)
DOMAIN-SUFFIX,gstatic.com,DIRECT
DOMAIN-SUFFIX,googleapis.com,DIRECT
DOMAIN-SUFFIX,google.com,DIRECT

# --- остальное ---
FINAL,DIRECT
