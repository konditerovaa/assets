[General]
loglevel = notify

# стабильный DNS (важно)
dns-server = system, 1.1.1.1, 8.8.8.8

skip-proxy = 127.0.0.1, localhost, *.local, *.lan

# =========================
# ПРОКСИ ИЗ ПОДПИСКИ
# =========================

[Proxy Group]

# 🔥 УМНЫЙ РЕЖИМ
# сначала DIRECT → если не работает → PROXY
AUTO = fallback, DIRECT, (.*), url=https://www.gstatic.com/generate_204, interval=300

# ручной выбор (если нужно)
PROXY = select, AUTO, (.*)

DIRECT = direct

# =========================
# RULES
# =========================

[Rule]

# 🏠 ЛОКАЛКА (всегда напрямую)
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# 🇷🇺 РФ (анти-палево)
DOMAIN-KEYWORD,bank,DIRECT
DOMAIN-KEYWORD,tinkoff,DIRECT
DOMAIN-KEYWORD,sber,DIRECT
DOMAIN-KEYWORD,vtb,DIRECT

DOMAIN-SUFFIX,yandex.ru,DIRECT
DOMAIN-SUFFIX,mail.ru,DIRECT
DOMAIN-SUFFIX,vk.com,DIRECT

# маркетплейсы (чтобы не палился VPN)
DOMAIN-KEYWORD,ozon,DIRECT
DOMAIN-SUFFIX,ozon.ru,DIRECT
DOMAIN-SUFFIX,wildberries.ru,DIRECT

# =========================
# 🔥 КРИТИЧНЫЕ СЕРВИСЫ → AUTO
# =========================

# Telegram
DOMAIN-KEYWORD,telegram,AUTO
IP-CIDR,91.108.0.0/16,AUTO,no-resolve
IP-CIDR,149.154.0.0/16,AUTO,no-resolve

# YouTube
DOMAIN-KEYWORD,youtube,AUTO
DOMAIN-KEYWORD,googlevideo,AUTO
DOMAIN-SUFFIX,googleapis.com,AUTO
DOMAIN-SUFFIX,gstatic.com,AUTO
DOMAIN-KEYWORD,google,AUTO

# Instagram / Facebook
DOMAIN-SUFFIX,instagram.com,AUTO
DOMAIN-SUFFIX,facebook.com,AUTO
DOMAIN-SUFFIX,fbcdn.net,AUTO

# TikTok
DOMAIN-SUFFIX,tiktok.com,AUTO
DOMAIN-SUFFIX,byteoversea.com,AUTO

# ChatGPT (НЕ через домены, а через AUTO)
DOMAIN-KEYWORD,openai,AUTO

# Strava
DOMAIN-SUFFIX,strava.com,AUTO
DOMAIN-SUFFIX,mapbox.com,AUTO
DOMAIN-SUFFIX,mapboxapi.com,AUTO

# eBay
DOMAIN-SUFFIX,ebay.com,AUTO
DOMAIN-SUFFIX,ebayimg.com,AUTO

# =========================
# ❗ ВСЁ ОСТАЛЬНО
# =========================
FINAL,AUTO
